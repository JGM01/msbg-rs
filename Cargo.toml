[package]
name = "msbg-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["msbg-render"]
resolver = "3"

[dependencies]
rayon = "1.12.0"
paste = "1.0"
ply-rs = "0.1.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
hashbrown = { version = "0.15", default-features = false }

[[bench]]
name = "blockmap_bench"
harness = false

[[bench]]
name = "allocator_benches"
harness = false

[[bench]]
name = "density_bench"
harness = false

[[bench]]
name = "interp_bench"
harness = false

[[bench]]
name = "multires_bench"
harness = false

[[bench]]
name = "multires_scale_bench"
harness = false

[[bench]]
name = "scale_stress"
harness = false

[[bench]]
name = "surface_bench"
harness = false
